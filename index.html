/* ---------- KPI ---------- */
(function(){
  const k = DATA.kpi;
  const items = [
    { label:'评论总数', value: k.total.toLocaleString(), sub:'采集自天猫商品页' },
    { label:'好评率（全量）', value: k.all_pos_rate + '%', sub: k.all_pos.toLocaleString() + ' 条正面' },
    { label:'真实文本评论', value: k.real_n.toLocaleString(), sub: '占比 ' + (100-k.template_rate).toFixed(1) + '%' },
    { label:'真实评论好评率', value: k.real_pos_rate + '%', sub: '负面 ' + k.real_neg + ' 条 (' + k.real_neg_rate + '%)' },
    { label:'平均字数', value: k.avg_len, sub: '真实评论平均长度' },
    { label:'覆盖周期', value: k.months + ' 个月', sub: k.first_month + ' ~ ' + k.last_month }
  ];
  document.getElementById('kpis').innerHTML = items.map(function(it){
    const cls = String(it.value).length > 7 ? 'value small' : 'value';
    return '<div class="kpi"><div class="label">' + it.label + '</div><div class="' + cls + '">' +
           it.value + '</div><div class="sub">' + it.sub + '</div></div>';
  }).join('');
})();

/* ---------- 工具 ---------- */
function init(id){ return echarts.init(document.getElementById(id)); }
const charts = [];

/* 1. 评论构成 */
(function(){
  const c = init('c-compose');
  c.setOption({
    tooltip: { trigger:'item', formatter:'{b}: {c} 条 ({d}%)' },
    legend: { bottom: 0, itemWidth: 10, itemHeight: 10, textStyle:{ fontSize: 11 } },
    series: [{
      type:'pie', radius:['42%','68%'], center:['50%','45%'],
      itemStyle: { borderRadius: 6, borderColor:'#fff', borderWidth: 2 },
      label: { formatter:'{b}\n{d}%', fontSize: 11 },
      data: DATA.composition.map(function(d, i){
        const colors = [P.green, P.blue, P.gray, P.primary];
        return { name: d.name, value: d.value, itemStyle:{ color: colors[i % colors.length] } };
      })
    }]
  });
  charts.push(c);
})();

/* 2. 真实评论情感 */
(function(){
  const c = init('c-senti');
  c.setOption({
    tooltip: { trigger:'item', formatter:'{b}: {c} 条 ({d}%)' },
    legend: { bottom: 0, itemWidth: 10, itemHeight: 10, textStyle:{ fontSize: 11 } },
    series: [{
      type:'pie', radius:['45%','70%'], center:['50%','45%'],
      itemStyle: { borderRadius: 6, borderColor:'#fff', borderWidth: 2 },
      label: { formatter:'{b}\n{d}%', fontSize: 11 },
      data: DATA.real_sentiment.map(function(d){
        const map = { '正面':P.green, '中性':P.amber, '负面':P.red };
        return { name: d.name, value: d.value, itemStyle:{ color: map[d.name] || P.gray } };
      })
    }]
  });
  charts.push(c);
})();

(function(){
  const c = init('c-monthly');
  const m = DATA.monthly;
  c.setOption({
    tooltip: { trigger:'axis', axisPointer:{ type:'shadow' } },
    legend: { top: 0, itemWidth: 10, itemHeight: 10, textStyle:{ fontSize: 11 } },
    grid: { left: 45, right: 20, top: 40, bottom: 55 },
    xAxis: { type:'category', data: m.map(function(x){ return x.month; }),
             axisLabel:{ rotate: 45, fontSize: 10 } },
    yAxis: { type:'value', name:'评论数', nameTextStyle:{ fontSize: 11 } },
    series: [
      { name:'真实评论', type:'bar', stack:'t', data: m.map(function(x){ return x.real; }),
        itemStyle:{ color: P.primary }, barMaxWidth: 26 },
      { name:'模板评论', type:'bar', stack:'t',
        data: m.map(function(x){ return x.count - x.real; }),
        itemStyle:{ color:'#cbd5e1' }, barMaxWidth: 26 }
    ]
  });
  charts.push(c);
})();

/* 4. 主题排行 */
(function(){
  const c = init('c-theme');
  const th = DATA.themes.slice(0, 10).reverse();
  c.setOption({
    tooltip: { trigger:'axis', axisPointer:{ type:'shadow' },
               formatter: function(p){ return p[0].name + '<br/>命中 ' + p[0].value + ' 条'; } },
    grid: { left: 95, right: 55, top: 15, bottom: 20 },
    xAxis: { type:'value', axisLabel:{ fontSize: 10 } },
    yAxis: { type:'category', data: th.map(function(x){ return x.theme; }),
             axisLabel:{ fontSize: 11 } },
    series: [{
      type:'bar', data: th.map(function(x){ return x.count; }),
      itemStyle: { borderRadius:[0,5,5,0],
        color: new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#a855f7'},{offset:1,color:'#6d5ef7'}]) },
      label: { show:true, position:'right', fontSize: 10, color:'#64748b',
               formatter: function(p){ return th[p.dataIndex].rate + '%'; } },
      barMaxWidth: 18
    }]
  });
  charts.push(c);
})();

/* 5. SKU 分布 */
(function(){
  const c = init('c-sku');
  const top = DATA.sku_dist.slice(0, 7);
  const other = DATA.sku_dist.slice(7).reduce(function(a, b){ return a + b.value; }, 0);
  const items = top.map(function(d){ return { name: d.name, value: d.value }; });
  if (other > 0) items.push({ name:'其他', value: other });
  c.setOption({
    tooltip: { trigger:'item', formatter:'{b}: {c} 条 ({d}%)' },
    legend: { bottom: 0, itemWidth: 9, itemHeight: 9, textStyle:{ fontSize: 10 }, type:'scroll' },
    color: [P.primary, P.purple, P.blue, P.green, P.amber, '#14b8a6', '#f472b6', P.gray],
    series: [{
      type:'pie', radius:['40%','66%'], center:['50%','44%'],
      itemStyle: { borderRadius: 5, borderColor:'#fff', borderWidth: 2 },
      label: { formatter:'{d}%', fontSize: 10 },
      data: items
    }]
  });
  charts.push(c);
})();

/* 6. 各规格好评率 */
(function(){
  const c = init('c-skurate');
  const sr = DATA.sku_rate.slice().sort(function(a, b){ return b.rate - a.rate; });
  c.setOption({
    tooltip: { trigger:'axis', axisPointer:{ type:'shadow' },
               formatter: function(p){ const d = sr[p[0].dataIndex];
                 return d.name + '<br/>好评率 ' + d.rate + '%<br/>样本 ' + d.total + ' 条'; } },
    grid: { left: 100, right: 60, top: 15, bottom: 30 },
    xAxis: { type:'value', max: 100, axisLabel:{ formatter:'{value}%', fontSize: 10 } },
    yAxis: { type:'category', data: sr.map(function(x){ return x.name; }), axisLabel:{ fontSize: 11 } },
    series: [{
      type:'bar', data: sr.map(function(x){ return x.rate; }),
      itemStyle: { borderRadius:[0,5,5,0], color: P.green }, barMaxWidth: 16,
      label: { show:true, position:'right', fontSize: 10, color:'#64748b', formatter:'{c}%' }
    }]
  });
  charts.push(c);
})();

/* 7. 词云 */
(function(){
  const c = init('c-cloud');
  c.setOption({
    tooltip: { show:true },
    series: [{
      type:'wordCloud', shape:'circle',
      left:'center', top:'center', width:'95%', height:'92%',
      sizeRange:[12, 52], rotationRange:[-45, 45], gridSize: 6,
      textStyle: { color: function(){
        const cs = [P.primary, P.purple, P.blue, P.green, P.amber, '#14b8a6'];
        return cs[Math.floor(Math.random() * cs.length)]; } },
      data: DATA.word_cloud
    }]
  });
  charts.push(c);
})();

/* 8. 长度分布 */
(function(){
  const c = init('c-len');
  c.setOption({
    tooltip: { trigger:'axis' },
    grid: { left: 45, right: 25, top: 20, bottom: 35 },
    xAxis: { type:'category', data: DATA.len_dist.map(function(x){ return x.name; }),
             axisLabel:{ fontSize: 10 } },
    yAxis: { type:'value', axisLabel:{ fontSize: 10 } },
    series: [{
      type:'bar', data: DATA.len_dist.map(function(x){ return x.value; }),
      itemStyle: { borderRadius:[6,6,0,0],
        color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#a855f7'},{offset:1,color:'#6d5ef7'}]) },
      barMaxWidth: 46,
      label: { show:true, position:'top', fontSize: 10, color:'#64748b' }
    }]
  });
  charts.push(c);
})();

/* 9. 差评归因 */
(function(){
  const c = init('c-bad');
  const br = DATA.bad_reasons.slice().reverse();
  c.setOption({
    tooltip: { trigger:'axis', axisPointer:{ type:'shadow' },
               formatter: function(p){ return p[0].name + '<br/>提及 ' + p[0].value + ' 条'; } },
    grid: { left: 90, right: 45, top: 15, bottom: 30 },
    xAxis: { type:'value', axisLabel:{ fontSize: 10 } },
    yAxis: { type:'category', data: br.map(function(x){ return x.name; }), axisLabel:{ fontSize: 11 } },
    series: [{
      type:'bar', data: br.map(function(x){ return x.value; }),
      itemStyle: { borderRadius:[0,5,5,0], color: P.red }, barMaxWidth: 16,
      label: { show:true, position:'right', fontSize: 10, color:'#64748b' }
    }]
  });
  charts.push(c);
})();

/* ---------- 评论列表 ---------- */
(function(){
  const g = document.getElementById('good-list');
  const goods = DATA.good_samples || [];
  g.innerHTML = goods.length
    ? goods.map(function(t){ return '<div class="ritem">' + t + '</div>'; }).join('')
    : '<div class="empty">暂无</div>';

  const n = document.getElementById('neg-list');
  const negs = DATA.neg_texts || [];
  n.innerHTML = negs.length
    ? negs.slice(0, 25).map(function(t){ return '<div class="ritem neg">' + t + '</div>'; }).join('')
    : '<div class="empty">本次采集未发现明显负面评论</div>';
})();

/* ---------- 尺寸自适应 ---------- */
window.addEventListener('resize', function(){ charts.forEach(function(c){ c.resize(); }); });
</script>
</body>
</html>
